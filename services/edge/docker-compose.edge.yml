services:
  edge-compute:
    build: .
    container_name: spraycount-edge
    ports:
      - "${MJPEG_PORT:-8080}:8080"
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-roboflow}
      LOCAL_MODEL_PATH: ${LOCAL_MODEL_PATH:-/models/best.pt}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.85}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      ROBOFLOW_PROJECT: ${ROBOFLOW_PROJECT:-}
      ROBOFLOW_VERSION: ${ROBOFLOW_VERSION:-1}
      ACTIVE_SESSION_ID: ${ACTIVE_SESSION_ID:-demo-session}
      CAMERA_SOURCES: ${CAMERA_SOURCES:-}
      CAM_01_SOURCE: ${CAM_01_SOURCE:-/data/test_videos/cam01.mp4}
      CAM_02_SOURCE: ${CAM_02_SOURCE:-/data/test_videos/cam02.mp4}
      CAM_03_SOURCE: ${CAM_03_SOURCE:-/data/test_videos/cam03.mp4}
      CAM_04_SOURCE: ${CAM_04_SOURCE:-/data/test_videos/cam04.mp4}
      MJPEG_PORT: "8080"
      CONVEYOR_TRAVEL_SECONDS: ${CONVEYOR_TRAVEL_SECONDS:-3}
      SPINDLE_GAP_SECONDS: ${SPINDLE_GAP_SECONDS:-5}
    volumes:
      - ./data/test_videos:/data/test_videos:ro
      - ./models:/models:ro
    restart: unless-stopped
