services:
  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/001_better_auth.sql:/docker-entrypoint-initdb.d/001_better_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nextjs:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      EDGE_WORKER_HOST: ${EDGE_WORKER_HOST:-http://edge-worker:8081}
      CF_APP_ID: ${CF_APP_ID}
      CF_APP_SECRET: ${CF_APP_SECRET}
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: unless-stopped

  edge-worker:
    build:
      context: ./services/edge
    command: ["python", "main.py"]
    ports:
      - "${EDGE_HTTP_PORT:-8081}:8081"
    environment:
      CAMERA_SOURCES: '{"CAM-01":"${CAM_01_SOURCE:-/app/video/pov1.mp4}","CAM-02":"${CAM_02_SOURCE:-/app/video/pov2.mov}"}'
      TARGET_FPS: ${TARGET_FPS:-15}
      HTTP_PORT: "8081"
      CF_APP_ID: ${CF_APP_ID}
      CF_APP_SECRET: ${CF_APP_SECRET}
      CF_TRACK_NAMES: '{"CAM-01":"cam-01","CAM-02":"cam-02"}'
    volumes:
      - ./app/video:/app/video:ro
    restart: unless-stopped

volumes:
  auth_postgres_data:
