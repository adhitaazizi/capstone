services:
  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/001_better_auth.sql:/docker-entrypoint-initdb.d/001_better_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nextjs:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Jakarta
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      CF_APP_ID: ${CF_APP_ID}
      CF_APP_SECRET: ${CF_APP_SECRET}
      # Shared secret for the machine-to-machine /api/inference/* routes. Colab
      # reaches those over a public tunnel, so they cannot use a browser session.
      INFERENCE_API_KEY: ${INFERENCE_API_KEY}
      # Sampling pipeline tunables. Changing any of these needs only a restart
      # of this service — Colab keeps running.
      DETECTION_INTERVAL_MS: ${DETECTION_INTERVAL_MS:-2000}
      MAX_HOTWHEELS: ${MAX_HOTWHEELS:-8}
      SPINDLE_BOUNDARY_MARGIN: ${SPINDLE_BOUNDARY_MARGIN:-0.15}
      SPINDLE_MIN_CONFIDENCE: ${SPINDLE_MIN_CONFIDENCE:-0.5}
      HOTWHEELS_MIN_CONFIDENCE: ${HOTWHEELS_MIN_CONFIDENCE:-0.35}
      SPINDLE_ABSENT_INTERVALS: ${SPINDLE_ABSENT_INTERVALS:-1}
      MAX_VISIT_INTERVALS: ${MAX_VISIT_INTERVALS:-15}
      ENTRY_CAMERA_ID: ${ENTRY_CAMERA_ID:-CAM-01}
      EXIT_CAMERA_ID: ${EXIT_CAMERA_ID:-CAM-02}
      SPINDLE_ORPHAN_TIMEOUT_MS: ${SPINDLE_ORPHAN_TIMEOUT_MS:-300000}
    # NOTE: the FIFO pairing queue is in-process state. Scaling this service to
    # more than one replica would give each replica its own queue and silently
    # corrupt the cross-camera pairing.
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: unless-stopped

  edge-worker:
    build:
      context: ./services/edge
    command: ["python", "main.py"]
    ports:
      - "${EDGE_HTTP_PORT:-8081}:8081"
    environment:
      CAMERA_SOURCES: '{"CAM-01":"${CAM_01_SOURCE:-/app/video/pov1.mp4}","CAM-02":"${CAM_02_SOURCE:-/app/video/pov2.mov}"}'
      TARGET_FPS: ${TARGET_FPS:-15}
      HTTP_PORT: "8081"
      CF_APP_ID: ${CF_APP_ID}
      CF_APP_SECRET: ${CF_APP_SECRET}
      # Separate credential pair from CF_APP_ID/SECRET, created under "TURN"
      # in the Cloudflare dashboard. Required when the publisher sits behind a
      # NAT that plain STUN cannot traverse.
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID}
      CF_TURN_KEY_TOKEN: ${CF_TURN_KEY_TOKEN}
      CF_TRACK_NAMES: '{"CAM-01":"cam-01","CAM-02":"cam-02"}'
      # Where to register the Cloudflare source session so Colab can discover
      # it. Same Docker network, so no tunnel is involved here.
      NEXTJS_INTERNAL_URL: ${NEXTJS_INTERNAL_URL:-http://nextjs:3000}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY}
    volumes:
      - ./app/video:/app/video:ro
    depends_on:
      - nextjs
    restart: unless-stopped

  # GPU inference worker — the native-Python counterpart to
  # capstone_inference.ipynb (see services/inference/README.md). Needs an
  # NVIDIA GPU + the NVIDIA Container Toolkit on the host, so this service is
  # opt-in: `docker compose up -d` never starts it. Run it explicitly with:
  #   docker compose --profile inference up -d --build inference
  inference:
    build:
      context: ./services/inference
    profiles: ["inference"]
    environment:
      NEXTJS_BASE_URL: http://nextjs:3000
      INFERENCE_API_KEY: ${INFERENCE_API_KEY}
      CF_APP_SECRET: ${CF_APP_SECRET}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID}
      CF_TURN_KEY_TOKEN: ${CF_TURN_KEY_TOKEN}
      CHECKPOINT_PATH: /app/weights/checkpoint_best_total.pth
    volumes:
      - ./weights:/app/weights:ro
    depends_on:
      - nextjs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  auth_postgres_data:
